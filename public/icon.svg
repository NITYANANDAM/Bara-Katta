<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#2c140e" />
      <stop offset="80%" stopColor="#180a06" />
      <stop offset="100%" stopColor="#0c0503" />
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fbbf24" />
      <stop offset="50%" stopColor="#d97706" />
      <stop offset="100%" stopColor="#92400e" />
    </linearGradient>
    <linearGradient id="cowrieIvory" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fffdfa" />
      <stop offset="50%" stopColor="#faeed6" />
      <stop offset="100%" stopColor="#e5cca6" />
    </linearGradient>
    <linearGradient id="cowrieSlit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#451a03" />
      <stop offset="50%" stopColor="#1a0601" />
      <stop offset="100%" stopColor="#451a03" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners for icon -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="480" height="480" x="16" y="16" rx="96" fill="none" stroke="url(#goldBorder)" stroke-width="6" opacity="0.8" />

  <!-- Traditional Rangoli / Muggu Corners -->
  <g stroke="#f59e0b" stroke-width="3" fill="none" opacity="0.45">
    <!-- Top-left -->
    <path d="M 48 90 Q 48 48 90 48" />
    <circle cx="90" cy="90" r="6" fill="#f59e0b" />
    <!-- Top-right -->
    <path d="M 464 90 Q 464 48 422 48" />
    <circle cx="422" cy="90" r="6" fill="#f59e0b" />
    <!-- Bottom-left -->
    <path d="M 48 422 Q 48 464 90 464" />
    <circle cx="90" cy="422" r="6" fill="#f59e0b" />
    <!-- Bottom-right -->
    <path d="M 464 422 Q 464 464 422 464" />
    <circle cx="422" cy="422" r="6" fill="#f59e0b" />
  </g>

  <!-- Traditional Safe Cross ('X' / Katta) Behind Shell -->
  <g stroke="#f59e0b" stroke-width="12" stroke-linecap="round" opacity="0.35">
    <line x1="120" y1="120" x2="392" y2="392" />
    <line x1="392" y1="120" x2="120" y2="392" />
  </g>

  <!-- Central Authentic Cowrie Shell (Gavva) -->
  <g transform="translate(256, 256) scale(4.4) translate(-22, -28)" filter="url(#glow)">
    <!-- Outer Porcelain Lip -->
    <path
      d="M 22 2 C 34 2, 42 16, 42 32 C 42 46, 33 54, 22 54 C 11 54, 2 46, 2 32 C 2 16, 10 2, 22 2 Z"
      fill="url(#cowrieIvory)"
      stroke="#b4834b"
      stroke-width="1.2"
    />
    <!-- Inner mouth recess -->
    <path
      d="M 22 8 C 30 14, 32 26, 30 42 C 28 47, 25 49, 22 49 C 19 49, 16 47, 14 42 C 12 26, 14 14, 22 8 Z"
      fill="#f3e0c0"
      stroke="#996a35"
      stroke-width="0.8"
    />
    <!-- Deep opening slit -->
    <path
      d="M 22 10 Q 20 28 22 46 Q 24 28 22 10 Z"
      fill="url(#cowrieSlit)"
    />
    <!-- Shell teeth -->
    <line x1="17" y1="17" x2="21" y2="17" stroke="#78350f" stroke-width="1" stroke-linecap="round" />
    <line x1="16" y1="22" x2="21" y2="22" stroke="#78350f" stroke-width="1" stroke-linecap="round" />
    <line x1="16" y1="27" x2="21" y2="27" stroke="#78350f" stroke-width="1" stroke-linecap="round" />
    <line x1="16" y1="32" x2="21" y2="32" stroke="#78350f" stroke-width="1" stroke-linecap="round" />
    <line x1="17" y1="37" x2="21" y2="37" stroke="#78350f" stroke-width="1" stroke-linecap="round" />

    <line x1="23" y1="17" x2="27" y2="17" stroke="#78350f" stroke-width="1" stroke-linecap="round" />
    <line x1="23" y1="22" x2="28" y2="22" stroke="#78350f" stroke-width="1" stroke-linecap="round" />
    <line x1="23" y1="27" x2="28" y2="27" stroke="#78350f" stroke-width="1" stroke-linecap="round" />
    <line x1="23" y1="32" x2="28" y2="32" stroke="#78350f" stroke-width="1" stroke-linecap="round" />
    <line x1="23" y1="37" x2="27" y2="37" stroke="#78350f" stroke-width="1" stroke-linecap="round" />
  </g>

  <!-- Telugu Title at Bottom -->
  <text x="256" y="455" font-family="'Noto Sans Telugu', sans-serif" font-size="34" font-weight="700" fill="#fde68a" text-anchor="middle" letter-spacing="2">
    బారాకట్ట
  </text>
</svg>
